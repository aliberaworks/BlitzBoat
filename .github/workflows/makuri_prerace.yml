name: makuri Pre-Race Notify

on:
  workflow_dispatch:
    inputs:
      date:
        description: '日付 YYYYMMDD'
        required: false
      win_min:
        description: '通知窓・下限(分前)'
        default: '30'
      win_max:
        description: '通知窓・上限(分前)'
        default: '60'

permissions:
  contents: write

env:
  PYTHONIOENCODING: utf-8

jobs:
  prerace:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml numpy scikit-learn python-dotenv

      - name: Run prerace notifier
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        working-directory: makuri
        run: |
          HD="${{ github.event.inputs.date }}"
          HD="${HD:-$(TZ=Asia/Tokyo date +%Y%m%d)}"
          MIN="${{ github.event.inputs.win_min || '30' }}"
          MAX="${{ github.event.inputs.win_max || '60' }}"
          python prerace.py --date "$HD" --min "$MIN" --max "$MAX"

      - name: Commit prerace data
        run: |
          git config user.name "makuri Bot"
          git config user.email "bot@makuri.dev"
          git add makuri/data/prerace_*.json || true
          git diff --staged --quiet || git commit -m "Prerace $(TZ=Asia/Tokyo date +%Y%m%d-%H%M)"
          git push || true
