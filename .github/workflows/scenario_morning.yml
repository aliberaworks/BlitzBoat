name: ScenarioBoat Morning Batch

on:
  schedule:
    - cron: '0 21 * * *'  # 6:00 JST (UTC 21:00)
  workflow_dispatch:
    inputs:
      date:
        description: '日付 YYYYMMDD (空欄=今日)'
        required: false

permissions:
  contents: write

env:
  PYTHONIOENCODING: utf-8

jobs:
  morning-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml numpy scipy scikit-learn pandas python-dotenv

      - name: Run ScenarioBoat morning batch
        run: |
          HD="${{ github.event.inputs.date }}"
          HD="${HD:-$(TZ=Asia/Tokyo date +%Y%m%d)}"
          echo "ScenarioBoat 朝バッチ: $HD"
          python scenario_boat/morning_batch.py --date "$HD"

      - name: Commit predictions
        run: |
          git config user.name "BlitzBoat Bot"
          git config user.email "bot@blitzboat.dev"
          git add scenario_boat/data/scenario_today_*.json || true
          git diff --staged --quiet || git commit -m "ScenarioBoat morning $(TZ=Asia/Tokyo date +%Y%m%d)"
          git push || true
